# Omit model to use the SDK runtime's default. Host Codex configuration is not inherited.
timeout_seconds: 900
max_log_bytes: 2000000
max_revisions: 3
# Independent task limits; an explicit CLI --jobs overrides the corresponding value.
scheduler:
  jobs: 2  # 1-3; defaults to 1 when omitted.
qa:
  jobs: 2  # Positive integer; defaults to 2 when omitted.
roles:
  analyst: >-
    Analyze the registered request. Inspect the repository and produce a concrete plan
    with acceptance criteria and dependencies. Do not modify files.
  developer: >-
    Implement only the confirmed plan. Work inside the assigned workspace and run
    relevant tests. Report changes and test evidence, including failures.
# Remote control is disabled unless explicit GitHub operators are configured.
copilot:
  operators: []
  # mode: step  # Optional initial mode. Manual registration defaults to auto.
# Opt in with explicit repository/path/label sources; see README.
discovery:
  enabled: false
  interval_seconds: 60
  max_new_per_scan: 10
  sources: []
