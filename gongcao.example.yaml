# 项目默认值显式传给 SDK；不会继承宿主 Codex 配置或静默降级。
model: gpt-6.1-sol
reasoning_effort: xhigh
timeout_seconds: 900
max_log_bytes: 2000000
max_revisions: 3
# 正式任务与 QA 批次的并发额度相互独立；命令行 --jobs 优先于此处配置。
scheduler:
  jobs: 2  # 允许 1～3；省略时默认 1。
qa:
  jobs: 2  # 正整数；省略时默认 2。
roles:
  # 以下是发送给 Agent 的任务提示词（实际配置值，不是注释），故保持原文。
  analyst: >-
    Analyze the registered request. Inspect the repository and produce a concrete plan
    with acceptance criteria and dependencies. Do not modify files.
  developer: >-
    Implement only the confirmed plan. Work inside the assigned workspace and run
    relevant tests. Report changes and test evidence, including failures.
# 仅允许指定 GitHub 用户通过 Issue 评论控制任务；不配置操作员时禁用远程指令。
copilot:
  operators: []
  # mode: step  # 可选的初始模式；手工登记默认 auto。
# 自动发现默认关闭；启用时须明确配置仓库、目录及标签，详见 README。
discovery:
  enabled: false
  interval_seconds: 60
  max_new_per_scan: 10
  sources: []
